name: Update Dashboard

on:
  schedule:
    # Monday 7 AM KST = Sunday 22:00 UTC: archive and reset the prior week.
    - cron: '0 22 * * 0'
  workflow_dispatch:
  push:
    paths:
      - 'dashboard/data.json'

permissions:
  contents: write

jobs:
  weekly-reset:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Check weekly reset
        id: check_weekly
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: |
          set +e
          python3 dashboard/check_weekly_reset.py
          EXIT_CODE=$?
          set -e
          echo "reset_happened=$EXIT_CODE" >> "$GITHUB_OUTPUT"

      - name: Update README with charts
        if: steps.check_weekly.outputs.reset_happened == '0'
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 dashboard/update_readme_charts.py

      - name: Generate weekly history SVGs
        if: steps.check_weekly.outputs.reset_happened == '0'
        run: python3 dashboard/generate_weekly_history.py

      - name: Update README with history
        if: steps.check_weekly.outputs.reset_happened == '0'
        run: python3 dashboard/update_readme_history.py

      - name: Commit weekly reset changes
        if: steps.check_weekly.outputs.reset_happened == '0'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add dashboard/data.json dashboard/history/ dashboard/weekly_dashboard.svg dashboard/progress_sparklines.svg README.md
          if ! git diff --staged --quiet; then
            git commit -m "Weekly reset: save history and reset metrics" -m "Auto-generated weekly history SVGs and updated README"
            git pull --rebase
            git push
          fi

  update-dashboard:
    needs: weekly-reset
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest branch state
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Regenerate dashboard, charts, and cache keys
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python3 dashboard/update_readme_charts.py

      - name: Regenerate history SVGs from corrected data
        run: python3 dashboard/generate_weekly_history.py --force

      - name: Update README with history
        run: python3 dashboard/update_readme_history.py

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "update: automated dashboard generation"
            git pull --rebase
            git push
          else
            echo "No changes to commit"
          fi
