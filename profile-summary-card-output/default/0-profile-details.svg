<text x="936" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3e3e37" font-weight="600" text-anchor="end" letter-spacing="0.14em">SINCE AUGUST 2024</text>
<line x1="64" y1="50" x2="936" y2="50" stroke="#15150f" stroke-width="2"/>
<text x="82" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">•  Started with a simple idea: make language learning feel like</text>
<text x="82" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">    talking with a friend</text>
<text x="82" y="156" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">•  But, I couldn’t code. So I learned from scratch</text>
<text x="82" y="186" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">•  Built the iOS app, taught myself backend logic</text>
<text x="82" y="216" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">•  Pouring everything that i’ve got into making conversations</text>
<text x="82" y="246" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">    feel natural and fun</text>
<text x="82" y="276" font-family="Georgia, 'Times New Roman', serif" font-size="17" fill="#15150f" font-weight="400">•  Curious about my story? → kimkb.com</text>
<text x="740" y="96" font-family="system-ui, -apple-system, sans-serif" font-size="12" fill="#3e3e37" font-weight="600" letter-spacing="0.14em">DAYS BUILDING</text>
<text x="740" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="72" fill="#15150f" font-weight="700" letter-spacing="-0.035em">781</text>
<text x="740" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="15" fill="#3e3e37" font-weight="400" font-style="italic">from the first line of code to today</text>
